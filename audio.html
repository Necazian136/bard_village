<script>
    const BS = (1 << 10) * 2

    class AudioVisualizer {
        constructor(audioContext, processFrame, processError) {
            this.audioContext = audioContext;
            this.processFrame = processFrame;
            this.pitchAnalyzer = new PitchAnalyzer(this.audioContext.sampleRate);
            this.globalFrequencyData = new Float32Array(BS);
            this.globalFrequencyDataFilledNumber = 0;
            this.connectStream = this.connectStream.bind(this);
            navigator.mediaDevices.getUserMedia({audio: true, video: false})
                .then(this.connectStream)
                .catch((error) => {
                    if (processError) {
                        processError(error);
                    }
                });
        }

        connectStream(stream) {
            this.analyser = this.audioContext.createAnalyser();
            const source = this.audioContext.createMediaStreamSource(stream);
            source.connect(this.analyser);
            this.analyser.smoothingTimeConstant = 0.5;
            this.analyser.fftSize = 32;

            this.initRenderLoop(this.analyser);
        }

        initRenderLoop() {
            const frequencyData = new Uint8Array(this.analyser.frequencyBinCount);
            const frequencyData1 = new Float32Array(this.analyser.frequencyBinCount);
            const processFrame = this.processFrame || (() => {
            });

            const renderFrame = () => {
                this.analyser.getByteFrequencyData(frequencyData);
                this.analyser.getFloatFrequencyData(frequencyData1);

                if (this.globalFrequencyDataFilledNumber < BS) {
                    for (let i = 0; i < frequencyData1.length; i++) {
                        this.globalFrequencyData[this.globalFrequencyDataFilledNumber] = frequencyData1[i]
                        this.globalFrequencyDataFilledNumber++;
                    }
                } else {
                    for (let i = 0; i < this.globalFrequencyData.length - frequencyData1.length; i++) {
                        this.globalFrequencyData[this.globalFrequencyDataFilledNumber] = frequencyData1[i]
                        this.globalFrequencyDataFilledNumber++;
                    }

                    this.pitchAnalyzer.input(frequencyData1);
                    this.pitchAnalyzer.process();
                    const tone = this.pitchAnalyzer.findTone();

                    if (tone === null) {
                        console.log('No tone found!');
                    } else {
                        console.log('Found a tone, frequency:', tone.freq, 'volume:', tone.db);
                    }
                }

                processFrame(frequencyData);

                requestAnimationFrame(renderFrame);
            };
            requestAnimationFrame(renderFrame);
        }
    }

    const visualMainElement = document.querySelector('main');
    const visualValueCount = 16;
    let visualElements;
    const createDOMElements = () => {
        let i;
        for (i = 0; i < visualValueCount; ++i) {
            const elm = document.createElement('div');
            visualMainElement.appendChild(elm);
        }

        visualElements = document.querySelectorAll('main div');
    };
    createDOMElements();

    const init = () => {
        // Creating initial DOM elements
        const audioContext = new AudioContext();
        const initDOM = () => {
            visualMainElement.innerHTML = '';
            createDOMElements();
        };
        initDOM();

        // Swapping values around for a better visual effect
        const dataMap = {
            0: 15,
            1: 10,
            2: 8,
            3: 9,
            4: 6,
            5: 5,
            6: 2,
            7: 1,
            8: 0,
            9: 4,
            10: 3,
            11: 7,
            12: 11,
            13: 12,
            14: 13,
            15: 14
        };
        const processFrame = (data) => {
            const values = Object.values(data);
            let i;
            for (i = 0; i < visualValueCount; ++i) {
                const value = values[dataMap[i]] / 255;
                const elmStyles = visualElements[i].style;
                elmStyles.transform = `scaleY( ${value} )`;
                elmStyles.opacity = Math.max(.25, value);
            }
        };

        const processError = () => {
            visualMainElement.classList.add('error');
            visualMainElement.innerText = 'Please allow access to your microphone in order to see this demo.\nNothing bad is going to happen... hopefully :P';
        }

        new AudioVisualizer(audioContext, processFrame, processError);
    };
</script>
